# Phase 5 — Cross-cutting α-mapping (Spec §8)

experiment_id: phase5_cross_cutting
seed: 42

inputs:
  exp2_primary_csv: experiments/exp2_gsa_detection/results/exp2_patp_alpha_sweep.csv
  exp2_realnoise_csv: experiments/exp2_gsa_detection/results_realnoise/exp2_patp_alpha_sweep.csv
  exp3_csv: experiments/exp3_dsge_classification/results/exp3_patp_alpha_sweep.csv
  exp4_json: experiments/exp4_patp_denoiser/results/exp4_alpha_mapping.json

dataset_aliases:
  exp2_primary: fpv_telemetry_polygauss_qpsk_bs1024_n100000_953c56e8
  exp2_realnoise: fpv_realnoise_bpsk_qpsk

regression:
  poly_degree: 2
  ridge_alpha: 1.0e-3
  include_task_dummies: true

monotonicity:
  gamma4_grid: [-2.0, -1.5, -1.0, -0.7, -0.5, -0.25, 0.0, 0.25, 0.5, 1.0, 1.5, 2.0]
  fixed_gamma3: 0.0
  fixed_snr_db: 0.0
  task_type: detection

transferability:
  train_on: classification
  test_on: detection
  exp2_dataset_for_test: fpv_realnoise_bpsk_qpsk    # de-facto more interesting (real RF noise)
  metric: AUC
  pass_threshold_mean_ratio: 0.90

pareto:
  axes:
    - alpha_distance_to_05
    - metric_normalized
    - snr_db

output:
  results_dir: experiments/phase5_cross_cutting/results
  figures_dir: experiments/phase5_cross_cutting/figures
  unified_csv: phase5_unified_alpha.csv
  mapping_json: phase5_alpha_mapping.json
  verification_json: phase5_verification.json
  manifest: manifest.json
