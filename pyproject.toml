[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdr-kunchenko"
version = "0.1.0"
description = "Reproducibility package for the sdr-kunchenko article series (PMM, PATP, DSGE applied to SDR baseband)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Serhii Zabolotnii", email = "szabolotnii@healthprecision.com" },
]
license = { text = "MIT" }
keywords = ["pmm", "dsge", "patp", "kunchenko", "sdr", "non-gaussian", "signal-processing", "rf-fingerprinting"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "h5py>=3.9",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "joblib>=1.3",
    "rpy2>=3.5",  # bridge to EstemPMM (CRAN R package, oracle for PMM)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "hypothesis>=6.90",
    "ruff>=0.4",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "NPY"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
